# Local development dependencies only: MongoDB for metadata, MinIO as an
# S3-compatible bucket. Not intended for production use.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # web console
    volumes: ['minio-data:/data']

volumes:
  mongo-data:
  minio-data:
